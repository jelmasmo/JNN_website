name = "jnn-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Pas de "main" ici : @cloudflare/vite-plugin le déduit lui-même de
# l'environnement "ssr" au moment de la construction, et régénère un
# wrangler.json correct dans dist/ (avec le bon "main") à chaque build.
# Le fixer nous-mêmes ici crée un problème d'œuf-et-poule (le fichier
# n'existe pas avant la construction) sans rien apporter.
#
# Pour le développement local : utiliser "npm run dev" (vite dev), qui
# fait tourner le Worker sous Miniflare directement, bindings compris
# (D1, etc). PAS besoin de "npm run build" + "wrangler dev" séparément —
# c'était la source de toute la confusion précédente.
#
# run_worker_first : sans lui, Cloudflare répond 404 lui-même pour toute
# page qui n'est pas un fichier statique, avant même que notre
# application n'ait la main.
assets = { directory = "dist/client", binding = "ASSETS", run_worker_first = true }

# Base de données D1 — remplace le localStorage du prototype.
# L'ID sera rempli après la création de la base avec :
#   wrangler d1 create jnn-db
[[d1_databases]]
binding = "DB"
database_name = "jnn-db"
database_id = "7147b999-ea90-419f-8da0-9fcc91e25fe7"
migrations_dir = "migrations"

# Stockage des photos (véhicules + panorama "véhicules vendus").
# Bucket créé avec : npx wrangler r2 bucket create jnn-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "jnn-photos"

# URL publique du bucket, pour construire les liens <img src="...">.
# Remplie une fois l'accès public activé (Dashboard Cloudflare → R2 →
# jnn-photos → Settings → Public access → Allow Access → copier l'URL
# "r2.dev", ou un domaine personnalisé si vous en branchez un).
[vars]
PHOTOS_PUBLIC_URL = "REMPLACER_APRES_ACCES_PUBLIC_R2"
