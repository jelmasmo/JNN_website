name = "jnn-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# "main" doit pointer sur le fichier produit par la construction (voir
# npm run build) — nécessaire pour que "wrangler dev"/"wrangler deploy"
# sache quel Worker faire tourner. Attention : NE PAS supprimer le
# dossier dist/ avant de reconstruire — le plugin vérifie que ce fichier
# existe déjà au tout début de la construction ; le supprimer casse ce
# contrôle. Une construction normale (sans rm -rf dist avant) le
# remplace proprement par la version à jour.
main = "dist/server/server.js"
# run_worker_first : sans lui, Cloudflare répond 404 lui-même pour toute
# page qui n'est pas un fichier statique, avant même que notre
# application n'ait la main.
assets = { directory = "dist/client", binding = "ASSETS", run_worker_first = true }

# Base de données D1 — remplace le localStorage du prototype.
# L'ID sera rempli après la création de la base avec :
#   wrangler d1 create jnn-db
[[d1_databases]]
binding = "DB"
database_name = "jnn-db"
database_id = "7147b999-ea90-419f-8da0-9fcc91e25fe7"
migrations_dir = "migrations"
