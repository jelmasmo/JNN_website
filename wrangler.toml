name = "jnn-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Pas de "main" : @cloudflare/vite-plugin le déduit lui-même de
# l'environnement "ssr" au moment de la construction (le fixer ici
# nous-mêmes crée un problème d'œuf-et-poule : le fichier n'existe pas
# encore avant la construction). On garde seulement "run_worker_first",
# qui est le vrai réglage important : sans lui, Cloudflare répond 404
# lui-même pour toute page qui n'est pas un fichier statique, avant
# même que notre application n'ait la main.
assets = { directory = "dist/client", binding = "ASSETS", run_worker_first = true }

# Base de données D1 — remplace le localStorage du prototype.
# L'ID sera rempli après la création de la base avec :
#   wrangler d1 create jnn-db
[[d1_databases]]
binding = "DB"
database_name = "jnn-db"
database_id = "7147b999-ea90-419f-8da0-9fcc91e25fe7"
migrations_dir = "migrations"
