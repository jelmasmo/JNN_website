name = "jnn-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "@tanstack/react-start/server-entry"

# Pour le développement local : utiliser "npm run dev" (vite dev), qui
# fait tourner le Worker sous Miniflare directement, bindings compris
# (D1, etc). PAS besoin de "npm run build" + "wrangler dev" séparément.

# Base de données D1 — remplace le localStorage du prototype.
# L'ID sera rempli après la création de la base avec :
#   wrangler d1 create jnn-db
[[d1_databases]]
binding = "DB"
database_name = "jnn-db"
database_id = "7147b999-ea90-419f-8da0-9fcc91e25fe7"
migrations_dir = "migrations"

# Stockage des photos (véhicules + panorama "véhicules vendus").
# Bucket créé avec : npx wrangler r2 bucket create jnn-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "jnn-photos"

# URL publique du bucket, pour construire les liens <img src="...">.
# Remplie une fois l'accès public activé (Dashboard Cloudflare → R2 →
# jnn-photos → Settings → Public access → Allow Access → copier l'URL
# "r2.dev", ou un domaine personnalisé si vous en branchez un).
[vars]
PHOTOS_PUBLIC_URL = "https://pub-e2eefd8a21594413947121065282cc97.r2.dev"
